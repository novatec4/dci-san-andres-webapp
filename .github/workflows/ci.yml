name: DCI CGPI CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests-and-quality:
    name: Pruebas Unitarias y Calidad OMS (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar Sintaxis JavaScript
        run: |
          node -c app/js/anthro_who.js
          node -c app/js/auth.js
          node -c app/js/credentials.js
          node -c app/js/data.js
          node -c app/js/protocols.js

      - name: Ejecutar Batería de Pruebas Unitarias OMS LMS
        run: node tests/run_all_tests.js

  docker-multicontainer-build:
    name: Construcción y Healthcheck Multicontenedor Docker
    runs-on: ubuntu-latest
    needs: unit-tests-and-quality
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Crear archivo .env desde plantilla
        run: cp .env.example .env

      - name: Construir e Iniciar Stack Multicontenedor
        run: docker compose up -d --build

      - name: Verificar Salud del Servicio Nginx WebApp
        run: |
          sleep 10
          curl --fail http://localhost:8086/ || exit 1

      - name: Detener Stack
        run: docker compose down
