<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Ayuda en Acción Ecuador - Plataforma de Caracterización Georreferenciada de la Población Infantil en San Andrés y Manglaralto">
  <meta name="theme-color" content="#E8734A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- App CSS -->
  <link rel="stylesheet" href="css/styles.css?v=2.6.2">
</head>
<body>
  <!-- Mobile TopBar Fija (Solo en móviles) -->
  <header class="mobile-topbar" id="mobile-topbar">
    <button class="mobile-hamburger-btn" id="btn-mobile-drawer" title="Abrir Menú">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="mobile-topbar-title" id="mobile-module-title">Dashboard</div>
    <div class="mobile-avatar-badge" id="mobile-user-avatar" onclick="if(confirm('¿Desea cerrar sesión?')) Auth.logout();">DF</div>
  </header>

    <!-- Sidebar / Drawer -->

      <div class="sidebar-header" style="display:flex;align-items:center;justify-content:space-between;position:relative;">
        <div class="logo">
          <img src="AEA-Imagotipo-naranja-ayuda-pantalla-4000x.png" alt="Ayuda en Acción" class="logo-img">
        </div>
        <button id="sidebar-collapse-btn" class="sidebar-collapse-btn" title="Colapsar / Expandir barra lateral (Desktop)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-module="dashboard" data-tooltip="Dashboard">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span>Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-module="portal" data-tooltip="Panel Encuestador">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
            <path d="M9 14l2 2 4-4"/>
          </svg>
          <span>Panel Encuestador</span>
        </a>
        <a href="#" class="nav-item" data-module="gis" data-tooltip="Mapa GIS San Andrés">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
          </svg>
          <span>Mapa GIS San Andrés</span>
        </a>
        <a href="#" class="nav-item" data-module="kobo" data-tooltip="Sincronización KoBo">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>

          </svg>
          <span>Equipo y Personal</span>
        </a>
        <a href="#" class="nav-item" data-module="protocols" data-tooltip="Protocolos de Campo">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/>
          </svg>
          <span>Protocolos de Campo</span>
        </a>
        <a href="#" class="nav-item" data-module="population" data-tooltip="Población Infantil">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/>
          </svg>
          <span>Población Infantil</span>
        </a>
        <a href="#" class="nav-item" data-module="users" data-tooltip="Gestión de Usuarios">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>Gestión de Usuarios</span>
        </a>
        <a href="#" class="nav-item" data-module="reports" data-tooltip="Reportes">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 13H8"/><path d="M16 17H8"/><path d="M16 13h-2"/>
          </svg>
          <span>Reportes</span>
        </a>
        <a href="#" class="nav-item" data-module="credentials" data-tooltip="Credenciales & QR" style="color: #E8734A; font-weight: 700;">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>

        <!-- Badge de Versión Vigente -->
        <div class="version-badge-container" onclick="App.showVersionModal()" title="Consultar versión vigente, especificaciones técnicas y auditoría">
          <div style="display:flex;align-items:center;gap:0.5rem;">
            <span class="version-pulse-dot"></span>
            <span style="font-size:0.75rem;font-weight:700;color:var(--text-primary);">v2.6.2 Oficial</span>
          </div>
          <span style="font-size:0.7rem;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:0.2rem;">Info ℹ️</span>
        </div>

        <!-- Selector de Tema Institucional -->
        <button class="theme-toggle" id="theme-toggle" title="Alternar entre tema oscuro y tema claro">
          <svg class="theme-icon theme-icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
          </svg>
          <svg class="theme-icon theme-icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
          <span class="theme-label">Modo Claro</span>
        </button>
        <div class="user-info">
          <div class="avatar" style="background: linear-gradient(135deg, #E8734A, #C85A32); color: white;">DF</div>
          <div class="user-details">
            <span class="user-name">Dennys Franklin Rojas</span>
            <span class="user-role">Administrador / CIO</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Module content rendered here by JS -->
    </main>
  </div>

  <!-- Mobile Bottom Navigation Bar (Fija en la base) -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
    <button class="bottom-nav-item active" data-module="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="bottom-nav-item" data-module="portal" id="btn-bottom-portal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 14l2 2 4-4"/></svg>
      <span>Portal</span>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>KoBo Sync</span>
    </button>
    <button class="bottom-nav-item" data-module="protocols">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/></svg>
      <span>Protocolos</span>
    </button>
    <button class="bottom-nav-item" data-module="menu" id="btn-bottom-menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      <span>Más</span>
    </button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="js/gis.js?v=2.6.2"></script>
  <script src="js/surveyors.js?v=2.6.2"></script>

  <script src="js/reports.js?v=2.6.2"></script>

  <!-- Service Worker PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=2.6.2')
          .then(reg => console.log('✅ [PWA] ServiceWorker registrado:', reg.scope))
          .catch(err => console.warn('⚠️ [PWA] Fallo de registro de ServiceWorker:', err));
      });
    }
  </script>
